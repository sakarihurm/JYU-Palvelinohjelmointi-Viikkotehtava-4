<!DOCTYPE html>
<html lang="fi" xmlns="http://www.w3.org/1999/xhtml" xml:lang="fi">
<head>
<meta charset="utf-8"/>
<link rel="StyleSheet" href="{{ url_for('static', filename='muokkaa.css') }}" type="text/css" />
<title>TIES4080 - Viikkotehtävä 3 - 2025 kesä</title>
</head>
<body>


<!-- täydennä lomaketta tarpeen mukaan. Älä kuitenkaan muuta kenttien nimiä -->
<nav class="navbar">

    {% if kirjautunut %}
    <a href="/joukkueet">{{ omistajan_nimi }}</a>    
    {% endif %}

    <a href="/" aria-current="page">Kilpailut</a>

    {% if kirjautunut %}
    <a href="{{ url_for('logout') }}">Kirjaudu ulos</a>
    {% else %}
    <a href="{{ url_for('login') }}">Kirjaudu sisään</a>
    {% endif %}

</nav>

<div class="container">

    <form id="muokkaa" action="{{ url_for('tallenna', sarja=sarjan_nimi, kilpailuid=kilpailuid, kilpailun_nimi=kilpailun_nimi) }}" method="POST">
        <p> {{kilpailun_nimi}} </p>
        <p> {{sarjan_nimi}} </p>
        
        <label>Nimi<input type="text" name="joukkueen_nimi" value=""/></label>
        
        <div id="jasenet">Jäsenet
            {% for i in range(0, 5) %}
            <label>Jäsen {{loop.index}}<input type="text" name="jasen"/></label>
            {% endfor %}
        </div>
        <p id="tallenna"><input type="submit" id="submit_painike" name="painike" value="Tallenna" /></p>

    {% if virhe %}
    <span class="virhe">{{virhe}}</span>
    {% endif %}
    </form>

 </div>
<!-- Tästä eteenpäin on vain apuvälineenä käytettäviä skriptejä -->
<!-- HTMLinspectoria käytetään sivun live-muutosten validointiin. Kannattaa
vielä varmuuden vuoksi ajaa välillä myös W3C:n validaattori -->
<script src="https://appro.mit.jyu.fi/tools/htmlinspector/html-inspector.js"></script>
<!-- Sivun validoinnin W3C:n validaattorilla voit tehdä milloin tahansa näppäinyhdistelmällä CTRL+ALT+V -->
<script src="https://appro.mit.jyu.fi/tools/validator/validator.user.js"></script>
<script src="https://appro.mit.jyu.fi/tools/validator/xml-validator.js"></script>
</body>
</html>
