<!DOCTYPE html>
<html lang="fi" xmlns="http://www.w3.org/1999/xhtml" xml:lang="fi">
<head>
<meta charset="utf-8"/>
<link rel="StyleSheet" href="static/etusivu.css" type="text/css" />
<title>TIES4080 - Viikkotehtävä 4 - 2026 kesä</title>
</head>
<body>
<nav class="navbar">

    {% if kirjautunut %}
    <a href="/joukkueet">{{ omistajan_nimi }}</a>    
    {% endif %}

    <a href="/" aria-current="page">Kilpailut</a>

    {% if kirjautunut %}
    <a href="/kirjaudu_ulos">Kirjaudu ulos</a>
    {% else %}
    <a href="/kirjaudu">Kirjaudu sisään</a>
    {% endif %}

</nav>

<!-- <p>Käytä tätä pohjana eli säilytä ainakin sivuun linkitetyt validointiskriptit.</p> -->

<div class="container">
    <h1>Kilpailut</h1>
    <form action="/">
    <div id="labels">
        <ul>
            {% for id, nimi, alkuaika in kilpailut %}
            <li>{{nimi}} - {{alkuaika}}</li>
            {% endfor %}
        </ul>
    </div>
    <!-- {% if virhe %}
    <span class="virhe">{{virhe}}</span>
    {% endif %} -->
    </form>

</div>

<!-- Tästä eteenpäin on vain apuvälineenä käytettäviä skriptejä -->
<!-- HTMLinspectoria käytetään sivun live-muutosten automaattiseen validointiin. Kannattaa
vielä varmuuden vuoksi ajaa välillä myös W3C:n validaattori -->
<script src="https://appro.mit.jyu.fi/tools/htmlinspector/html-inspector.js"></script>
<!-- Sivun validoinnin W3C:n validaattorilla voit tehdä milloin tahansa näppäinyhdistelmällä CTRL+ALT+V -->
<script src="https://appro.mit.jyu.fi/tools/validator/validator.user.js"></script>
<script src="https://appro.mit.jyu.fi/tools/validator/xml-validator.js"></script>
<script src="https://appro.mit.jyu.fi/ties4080/vt/vt1/2026k/forge.min.js"></script>
<script src="https://appro.mit.jyu.fi/ties4080/vt/vt1/2026k/chai.js"></script>
<script src="https://appro.mit.jyu.fi/ties4080/vt/vt1/2026k/mocha.js"></script>
<script src="https://appro.mit.jyu.fi/ties4080/vt/vt1/2026k/should.min.js"></script>
<script crossorigin="" src="https://appro.mit.jyu.fi/ties4080/vt/vt4/2026k/test.js"></script>
</body>
</html>
